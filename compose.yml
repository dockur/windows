services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      RAM-SIZE: "12G"
      CPU_CORES: "4"
      DISK_SIZE: "256G"
      AUDIO: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
      -  ./chrix:/shared
    restart: always
    stop_grace_period: 2m
