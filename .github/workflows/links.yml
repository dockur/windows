name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: links
  cancel-in-progress: false

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: read
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Install aria2
        run: |
          if ! command -v aria2c > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq --no-install-recommends -y aria2
          fi
      -
        name: Validate all download mirrors
        id: validate
        run: |
          errors=0
          tested=0
          host=""
          failed_links=""
          failed_links_html=""
          declare -A seen

          check() {
            local url="$1"
            local agent="Mozilla/5.0 (X11; Linux x86_64; rv:154.0) Gecko/20100101 Firefox/154.0"
            local output rc

            output=$(mktemp)

            if aria2c \
              --no-conf=true \
              --dry-run=true \
              --connect-timeout=30 \
              --timeout=30 \
              --max-tries=2 \
              --retry-wait=2 \
              --async-dns=false \
              --follow-metalink=false \
              --follow-torrent=false \
              --user-agent="$agent" \
              --console-log-level=error \
              --summary-interval=0 \
              --download-result=hide \
              --show-console-readout=false \
              --enable-color=false \
              -- "$url" > "$output" 2>&1; then
              rm -f -- "$output"
              return 0
            else
              rc=$?
            fi

            sed 's/^/      /' "$output" >&2
            echo "      aria2c exit status: $rc" >&2
            rm -f -- "$output"
            return 1
          }

          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*local[[:space:]]+host=\"(https://[^\"]+)\" ]]; then
              host="${BASH_REMATCH[1]%/}"
              continue
            fi

            [[ "$line" =~ ^[[:space:]]*url=\"(.+)\" ]] || continue
            val="${BASH_REMATCH[1]#/}"

            if [[ "$val" == https://* ]]; then
              url="$val"
            elif [[ -n "$host" ]]; then
              url="$host/$val"
            else
              continue
            fi

            [[ -v seen[$url] ]] && continue
            seen[$url]=1

            tested=$((tested + 1))

            if check "$url"; then
              echo "  OK: $url"
            else
              echo "FAIL: $url"
              errors=$((errors + 1))
              failed_links+="$url"$'\n'
              failed_links_html+="<li><a href=\"$url\">$url</a></li>"$'\n'
            fi
          done < "src/define.sh"

          echo ""
          printf '%d/%d tested links valid\n' "$((tested - errors))" "$tested"

          if (( errors > 0 )); then
            printf '%d blocking failure(s)\n' "$errors"

            {
              echo "failed=true"
              echo "links<<EOF"
              printf '%s' "$failed_links"
              echo "EOF"
              echo "html_links<<EOF"
              printf '%s' "$failed_links_html"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Send mail
        if: steps.validate.outputs.failed == 'true'
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Mirror verification failed!
          body: |
            Mirror verification failed!

            The following links failed:

            ${{ steps.validate.outputs.links }}

            See https://github.com/${{ github.repository }}/actions for more information.
          html_body: |
            <p>Mirror verification failed!</p>

            <p>The following links failed:</p>

            <ul>
            ${{ steps.validate.outputs.html_links }}
            </ul>

            <p>
              See
              <a href="https://github.com/${{ github.repository }}/actions">GitHub Actions</a>
              for more information.
            </p>
      -
        name: Fail workflow
        if: always() && steps.validate.outputs.failed == 'true'
        run: exit 1
