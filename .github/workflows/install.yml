name: Installation

on:
  workflow_call:
    inputs:
      name:
        description: Display name for the Windows version
        required: true
        type: string

      version:
        description: VERSION value passed to the container
        required: true
        type: string

      runner:
        description: GitHub Actions runner
        required: false
        default: ubuntu-24.04
        type: string

      image:
        description: Container image to test
        required: false
        default: ghcr.io/dockur/windows:latest
        type: string

      callback:
        description: Guest script type
        required: false
        default: powershell
        type: string

      cpu:
        description: CPU model exposed to Windows
        required: false
        default: host
        type: string

      expected_caption:
        description: Text expected in the Windows caption
        required: true
        type: string

      expected_edition:
        description: Expected Windows EditionID
        required: false
        default: ""
        type: string

      minimum_build:
        description: Minimum acceptable Windows build number
        required: true
        type: number

      platform:
        description: Expected Windows platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180

    env:
      CONTAINER: windows-test
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Check KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          test -c /dev/kvm

      - name: Free disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/az \
            /opt/ghc \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx

          sudo apt-get clean
          sudo rm -rf \
            /var/cache/apt/* \
            /var/lib/apt/lists/*

          docker system prune \
            --all \
            --force \
            --volumes > /dev/null || true

          available_kb="$(df --output=avail / | tail -1)"
          available_gb="$((available_kb / 1024 / 1024))"

          echo "Available disk space: ${available_gb} GB"

          if (( available_gb < 40 )); then
            echo "At least 40 GB of free space is required."
            exit 1
          fi

      - name: Prepare installation test
        id: test
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
        run: |
          set -Eeuo pipefail

          case "$CALLBACK" in
            powershell | legacy)
              ;;
            *)
              echo "Unsupported guest script type: $CALLBACK"
              exit 1
              ;;
          esac

          token="$(cat /proc/sys/kernel/random/uuid)"

          mkdir -p \
            "$RUNNER_TEMP/data" \
            "$RUNNER_TEMP/oem" \
            "$RUNNER_TEMP/storage"

          printf '%s\n' "$token" > "$RUNNER_TEMP/data/readme.txt"

          case "$CALLBACK" in
            powershell)
              cat > "$RUNNER_TEMP/oem/ready.ps1" <<'POWERSHELL'
          param(
              [Parameter(Mandatory = $true)]
              [string]$Token
          )

          $ErrorActionPreference = "Stop"

          $windows = Get-CimInstance Win32_OperatingSystem
          $registry = Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $platform = switch (
              $env:PROCESSOR_ARCHITECTURE.ToUpperInvariant()
          ) {
              "AMD64" {
                  "x64"
              }
              "ARM64" {
                  "arm64"
              }
              "X86" {
                  "x86"
              }
              default {
                  $env:PROCESSOR_ARCHITECTURE.ToLowerInvariant()
              }
          }

          while ($true) {
              try {
                  $share = (
                      Get-Content `
                          -LiteralPath "\\host.lan\Data\readme.txt" `
                          -Raw
                  ).Trim()

                  $result = @{
                      token    = $Token
                      caption  = [string]$windows.Caption
                      edition  = [string]$registry.EditionID
                      version  = [string]$windows.Version
                      build    = [string]$windows.BuildNumber
                      platform = $platform
                      share    = $share
                  }

                  $json = $result | ConvertTo-Json -Compress
                  $temporary = "\\host.lan\Data\windows.tmp"
                  $destination = "\\host.lan\Data\windows.json"
                  $encoding = New-Object System.Text.UTF8Encoding($false)

                  [System.IO.File]::WriteAllText(
                      $temporary,
                      $json,
                      $encoding
                  )

                  Move-Item `
                      -LiteralPath $temporary `
                      -Destination $destination `
                      -Force

                  break
              }
              catch {
                  Start-Sleep -Seconds 10
              }
          }
          POWERSHELL

              cat > "$RUNNER_TEMP/oem/install.bat" <<EOF
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass ^
            -File C:\OEM\ready.ps1 ^
            -Token "$token"
          EOF
              ;;

            legacy)
              cat > "$RUNNER_TEMP/oem/ready.vbs" <<EOF
          Option Explicit

          Dim service
          Dim systems
          Dim system
          Dim shell
          Dim files
          Dim input
          Dim output
          Dim caption
          Dim version
          Dim build
          Dim platform
          Dim share
          Dim json
          Dim temporary
          Dim destination

          Set service = GetObject("winmgmts:\\.\root\cimv2")
          Set systems = service.ExecQuery( _
              "Select * From Win32_OperatingSystem" _
          )

          caption = ""
          version = ""
          build = ""

          For Each system In systems
              caption = CStr(system.Caption)
              version = CStr(system.Version)
              build = CStr(system.BuildNumber)
              Exit For
          Next

          Set shell = CreateObject("WScript.Shell")
          Set files = CreateObject("Scripting.FileSystemObject")

          platform = UCase( _
              shell.ExpandEnvironmentStrings( _
                  "%PROCESSOR_ARCHITECTURE%" _
              ) _
          )

          Select Case platform
              Case "AMD64"
                  platform = "x64"
              Case "ARM64"
                  platform = "arm64"
              Case "X86"
                  platform = "x86"
              Case Else
                  platform = LCase(platform)
          End Select

          temporary = "\\host.lan\Data\windows.tmp"
          destination = "\\host.lan\Data\windows.json"

          Do
              Err.Clear
              Set input = Nothing
              Set output = Nothing

              On Error Resume Next

              Set input = files.OpenTextFile( _
                  "\\host.lan\Data\readme.txt", _
                  1, _
                  False _
              )

              If Err.Number = 0 Then
                  share = Trim(input.ReadAll)
                  input.Close

                  json = _
                      "{" & _
                      """token"":""" & JsonEscape("$token") & """," & _
                      """caption"":""" & JsonEscape(caption) & """," & _
                      """edition"":""""," & _
                      """version"":""" & JsonEscape(version) & """," & _
                      """build"":""" & JsonEscape(build) & """," & _
                      """platform"":""" & JsonEscape(platform) & """," & _
                      """share"":""" & JsonEscape(share) & """" & _
                      "}"

                  Err.Clear

                  Set output = files.CreateTextFile( _
                      temporary, _
                      True, _
                      False _
                  )

                  If Err.Number = 0 Then
                      output.Write json
                      output.Close

                      If files.FileExists(destination) Then
                          files.DeleteFile destination, True
                      End If

                      Err.Clear
                      files.MoveFile temporary, destination

                      If Err.Number = 0 Then
                          Exit Do
                      End If
                  End If
              End If

              On Error GoTo 0
              WScript.Sleep 10000
          Loop

          On Error GoTo 0

          Function JsonEscape(value)
              Dim result

              result = CStr(value)
              result = Replace(result, "\", "\\")
              result = Replace(result, Chr(34), "\" & Chr(34))
              result = Replace(result, Chr(8), "\b")
              result = Replace(result, Chr(9), "\t")
              result = Replace(result, Chr(10), "\n")
              result = Replace(result, Chr(12), "\f")
              result = Replace(result, Chr(13), "\r")

              JsonEscape = result
          End Function
          EOF

              cat > "$RUNNER_TEMP/oem/install.bat" <<'BATCH'
          @echo off
          cscript.exe //nologo C:\OEM\ready.vbs
          BATCH
              ;;
          esac

          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Pull image
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "$IMAGE"

          docker image inspect "$IMAGE" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Install and validate Windows
        shell: bash
        env:
          CPU: ${{ inputs.cpu }}
          EXPECTED_TOKEN: ${{ steps.test.outputs.token }}
          EXPECTED_CAPTION: ${{ inputs.expected_caption }}
          EXPECTED_EDITION: ${{ inputs.expected_edition }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
          MINIMUM_BUILD: ${{ inputs.minimum_build }}
          VERSION: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.name }}
        run: |
          set -Eeuo pipefail

          docker run --detach \
            --name "$CONTAINER" \
            --device /dev/kvm \
            --device /dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            --env "VERSION=$VERSION" \
            --env "RAM_SIZE=half" \
            --env "CPU_CORES=half" \
            --env "CPU_MODEL=$CPU" \
            --env "DISK_SIZE=64G" \
            --volume "$RUNNER_TEMP/data:/data" \
            --volume "$RUNNER_TEMP/oem:/oem:ro" \
            --volume "$RUNNER_TEMP/storage:/storage" \
            "$IMAGE"

          echo
          echo "Container log:"
          echo "------------------------------------------------------------"

          docker logs \
            --follow \
            --timestamps \
            "$CONTAINER" &

          logs_pid="$!"

          stop_logs() {
            kill "$logs_pid" 2>/dev/null || true
            wait "$logs_pid" 2>/dev/null || true
          }

          trap stop_logs EXIT

          deadline=$((SECONDS + 9000))

          while (( SECONDS < deadline )); do
            state="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER" 2>/dev/null || true
            )"

            if [[ "$state" != "running" ]]; then
              echo
              echo "------------------------------------------------------------"
              echo "Container stopped before Windows became ready."
              echo "Container state: ${state:-missing}"
              exit 1
            fi

            response=""

            if [[ -s "$RUNNER_TEMP/data/windows.json" ]]; then
              response="$(cat "$RUNNER_TEMP/data/windows.json")"
            fi

            if [[ -n "$response" ]]; then
              stop_logs
              trap - EXIT

              echo
              echo "------------------------------------------------------------"
              echo "Received response:"

              if ! jq . <<< "$response"; then
                echo "$response"
                echo "The guest returned invalid JSON."
                exit 1
              fi

              token="$(jq -r '.token // empty' <<< "$response")"
              caption="$(jq -r '.caption // empty' <<< "$response")"
              edition="$(jq -r '.edition // empty' <<< "$response")"
              version="$(jq -r '.version // empty' <<< "$response")"
              build="$(jq -r '.build // empty' <<< "$response")"
              platform="$(jq -r '.platform // empty' <<< "$response")"
              share="$(jq -r '.share // empty' <<< "$response")"

              if [[ "$token" != "$EXPECTED_TOKEN" ]]; then
                echo "The response token does not match."
                exit 1
              fi

              if [[ "$share" != "$EXPECTED_TOKEN" ]]; then
                echo "Failed to read \\\\host.lan\\Data\\readme.txt."
                echo "Expected contents:"
                echo "  $EXPECTED_TOKEN"
                echo "Received:"
                echo "  ${share:-empty}"
                exit 1
              fi

              if [[ "$caption" != *"$EXPECTED_CAPTION"* ]]; then
                echo "Expected caption containing:"
                echo "  $EXPECTED_CAPTION"
                echo "Received:"
                echo "  $caption"
                exit 1
              fi

              if [[ -n "$EXPECTED_EDITION" &&
                    "$edition" != "$EXPECTED_EDITION" ]]; then
                echo "Expected edition: $EXPECTED_EDITION"
                echo "Received edition: $edition"
                exit 1
              fi

              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Unexpected Windows version: $version"
                exit 1
              fi

              if [[ ! "$build" =~ ^[0-9]+$ ]]; then
                echo "Invalid Windows build number: $build"
                exit 1
              fi

              if (( build < MINIMUM_BUILD )); then
                echo "Expected build $MINIMUM_BUILD or newer."
                echo "Received build: $build"
                exit 1
              fi

              if [[ "$platform" != "$EXPECTED_PLATFORM" ]]; then
                echo "Expected platform:"
                echo "  $EXPECTED_PLATFORM"
                echo "Received platform:"
                echo "  $platform"
                exit 1
              fi

              echo
              echo "$DISPLAY_NAME installed successfully."
              echo "Version: $version"
              echo "Build: $build"
              echo "Platform: $platform"
              echo "Shared file: accessible"
              exit 0
            fi

            sleep 10
          done

          echo
          echo "------------------------------------------------------------"
          echo "Timed out waiting for Windows installation."
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm --force "$CONTAINER" 2>/dev/null || true
