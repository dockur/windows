name: Installation

on:
  workflow_call:
    inputs:
      name:
        description: Display name for the Windows version
        required: true
        type: string

      version:
        description: VERSION value passed to the container
        required: true
        type: string

      runner:
        description: GitHub Actions runner
        required: false
        default: ubuntu-24.04
        type: string

      image:
        description: Container image to test
        required: false
        default: ghcr.io/dockur/windows:latest
        type: string

      callback:
        description: Guest callback method
        required: false
        default: powershell
        type: string

      cpu:
        description: CPU model exposed to Windows
        required: false
        default: host
        type: string

      expected_caption:
        description: Text expected in the Windows caption
        required: true
        type: string

      expected_edition:
        description: Expected Windows EditionID
        required: false
        default: ""
        type: string

      minimum_build:
        description: Minimum acceptable Windows build number
        required: true
        type: number

      platform:
        description: Expected Windows platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180

    env:
      CONTAINER: windows-test
      RECEIVER: windows-receiver
      IMAGE: ${{ inputs.image }}
      TEST_PORT: "18080"

    steps:
      - name: Check KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Free disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/az \
            /opt/ghc \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx

          sudo apt-get clean
          sudo rm -rf \
            /var/cache/apt/* \
            /var/lib/apt/lists/*

          docker system prune \
            --all \
            --force \
            --volumes > /dev/null || true

          available_kb="$(df --output=avail / | tail -1)"
          available_gb="$((available_kb / 1024 / 1024))"

          echo "Available disk space: ${available_gb} GB"

          if (( available_gb < 40 )); then
            echo "At least 40 GB of free space is required."
            exit 1
          fi

      - name: Prepare installation test
        id: test
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
        run: |
          set -Eeuo pipefail

          case "$CALLBACK" in
            powershell | legacy)
              ;;
            *)
              echo "Unsupported callback method: $CALLBACK"
              exit 1
              ;;
          esac

          token="$(cat /proc/sys/kernel/random/uuid)"

          mkdir -p \
            "$RUNNER_TEMP/oem" \
            "$RUNNER_TEMP/output" \
            "$RUNNER_TEMP/receiver" \
            "$RUNNER_TEMP/storage"

          case "$CALLBACK" in
            powershell)
              cat > "$RUNNER_TEMP/oem/ready.ps1" <<'POWERSHELL'
          param(
              [Parameter(Mandatory = $true)]
              [string]$Token,

              [int]$Port = 18080
          )

          $ErrorActionPreference = "Stop"
          $windows = Get-CimInstance Win32_OperatingSystem
          $registry = Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $platform = switch (
              $env:PROCESSOR_ARCHITECTURE.ToUpperInvariant()
          ) {
              "AMD64" {
                  "x64"
              }
              "ARM64" {
                  "arm64"
              }
              "X86" {
                  "x86"
              }
              default {
                  $env:PROCESSOR_ARCHITECTURE.ToLowerInvariant()
              }
          }

          $result = @{
              token    = $Token
              caption  = [string]$windows.Caption
              edition  = [string]$registry.EditionID
              version  = [string]$windows.Version
              build    = [string]$windows.BuildNumber
              platform = $platform
          }

          $bodyText = $result | ConvertTo-Json -Compress
          $body = [System.Text.Encoding]::UTF8.GetBytes($bodyText)

          netsh advfirewall firewall add rule `
              name="Dockur installation test" `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$Port | Out-Null

          $listener = New-Object System.Net.Sockets.TcpListener(
              [System.Net.IPAddress]::Any,
              $Port
          )

          $listener.Start()

          while ($true) {
              $client = $listener.AcceptTcpClient()

              try {
                  $stream = $client.GetStream()
                  $reader = New-Object System.IO.StreamReader($stream)

                  while ($true) {
                      $line = $reader.ReadLine()

                      if ([string]::IsNullOrEmpty($line)) {
                          break
                      }
                  }

                  $headerText = (
                      "HTTP/1.1 200 OK`r`n" +
                      "Content-Type: application/json`r`n" +
                      "Content-Length: $($body.Length)`r`n" +
                      "Connection: close`r`n" +
                      "`r`n"
                  )

                  $header = [System.Text.Encoding]::ASCII.GetBytes(
                      $headerText
                  )

                  $stream.Write($header, 0, $header.Length)
                  $stream.Write($body, 0, $body.Length)
                  $stream.Flush()
              }
              catch {
                  Write-Output $_
              }
              finally {
                  $client.Close()
              }
          }
          POWERSHELL

              cat > "$RUNNER_TEMP/oem/install.bat" <<EOF
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass ^
            -File C:\OEM\ready.ps1 ^
            -Token "$token" ^
            -Port $TEST_PORT
          EOF
              ;;

            legacy)
              cat > "$RUNNER_TEMP/oem/ready.vbs" <<EOF
          Option Explicit

          Dim service
          Dim systems
          Dim system
          Dim shell
          Dim request
          Dim caption
          Dim version
          Dim build
          Dim platform
          Dim body

          Set service = GetObject("winmgmts:\\.\root\cimv2")
          Set systems = service.ExecQuery( _
              "Select * From Win32_OperatingSystem" _
          )

          caption = ""
          version = ""
          build = ""

          For Each system In systems
              caption = CStr(system.Caption)
              version = CStr(system.Version)
              build = CStr(system.BuildNumber)
              Exit For
          Next

          Set shell = CreateObject("WScript.Shell")

          platform = UCase( _
              shell.ExpandEnvironmentStrings( _
                  "%PROCESSOR_ARCHITECTURE%" _
              ) _
          )

          Select Case platform
              Case "AMD64"
                  platform = "x64"
              Case "ARM64"
                  platform = "arm64"
              Case "X86"
                  platform = "x86"
              Case Else
                  platform = LCase(platform)
          End Select

          body = _
              "token=" & Encode("$token") & _
              "&caption=" & Encode(caption) & _
              "&edition=" & _
              "&version=" & Encode(version) & _
              "&build=" & Encode(build) & _
              "&platform=" & Encode(platform)

          Do
              Err.Clear
              Set request = Nothing

              On Error Resume Next
              Set request = CreateObject( _
                  "WinHttp.WinHttpRequest.5.1" _
              )

              If request Is Nothing Then
                  Err.Clear
                  Set request = CreateObject( _
                      "MSXML2.ServerXMLHTTP.3.0" _
                  )
              End If

              If request Is Nothing Then
                  Err.Clear
                  Set request = CreateObject( _
                      "Microsoft.XMLHTTP" _
                  )
              End If

              If Not request Is Nothing Then
                  Err.Clear

                  request.Open _
                      "POST", _
                      "http://host.lan:$TEST_PORT/", _
                      False

                  request.SetRequestHeader _
                      "Content-Type", _
                      "application/x-www-form-urlencoded"

                  request.Send body

                  If Err.Number = 0 Then
                      If request.Status = 200 Then
                          Exit Do
                      End If
                  End If
              End If

              On Error GoTo 0
              WScript.Sleep 10000
          Loop

          On Error GoTo 0

          Function Encode(value)
              Dim stream
              Dim bytes
              Dim index
              Dim code
              Dim result

              Set stream = CreateObject("ADODB.Stream")

              stream.Type = 2
              stream.Charset = "utf-8"
              stream.Open
              stream.WriteText CStr(value)
              stream.Position = 0
              stream.Type = 1
              stream.Position = 3

              bytes = stream.Read
              stream.Close

              result = ""

              For index = 1 To LenB(bytes)
                  code = AscB(MidB(bytes, index, 1))

                  If _
                      (code >= 48 And code <= 57) Or _
                      (code >= 65 And code <= 90) Or _
                      (code >= 97 And code <= 122) Or _
                      code = 45 Or _
                      code = 46 Or _
                      code = 95 Or _
                      code = 126 _
                  Then
                      result = result & Chr(code)
                  ElseIf code = 32 Then
                      result = result & "+"
                  Else
                      result = result & "%" & _
                          Right("0" & Hex(code), 2)
                  End If
              Next

              Encode = result
          End Function
          EOF

              cat > "$RUNNER_TEMP/oem/install.bat" <<'BATCH'
          @echo off
          cscript.exe //nologo C:\OEM\ready.vbs
          BATCH

              cat > "$RUNNER_TEMP/receiver/receiver.py" <<'PYTHON'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          from urllib.parse import parse_qs

          OUTPUT = Path("/output/windows.json")


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self) -> None:
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length).decode(
                      "utf-8",
                      errors="replace",
                  )

                  values = parse_qs(
                      body,
                      keep_blank_values=True,
                  )

                  result = {
                      key: values.get(key, [""])[0]
                      for key in (
                          "token",
                          "caption",
                          "edition",
                          "version",
                          "build",
                          "platform",
                      )
                  }

                  temporary = OUTPUT.with_suffix(".tmp")
                  temporary.write_text(
                      json.dumps(result),
                      encoding="utf-8",
                  )
                  temporary.replace(OUTPUT)

                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(
                  self,
                  format: str,
                  *args: object,
              ) -> None:
                  return


          HTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
          PYTHON
              ;;
          esac

          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Pull image
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "$IMAGE"

          docker image inspect "$IMAGE" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Install and validate Windows
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
          CPU: ${{ inputs.cpu }}
          EXPECTED_TOKEN: ${{ steps.test.outputs.token }}
          EXPECTED_CAPTION: ${{ inputs.expected_caption }}
          EXPECTED_EDITION: ${{ inputs.expected_edition }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
          MINIMUM_BUILD: ${{ inputs.minimum_build }}
          VERSION: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.name }}
        run: |
          set -Eeuo pipefail

          docker_args=(
            --detach
            --name "$CONTAINER"
            --device /dev/kvm
            --device /dev/net/tun
            --cap-add NET_ADMIN
            --stop-timeout 120
            --env "VERSION=$VERSION"
            --env "RAM_SIZE=half"
            --env "CPU_CORES=half"
            --env "CPU_MODEL=$CPU"
            --env "DISK_SIZE=64G"
            --volume "$RUNNER_TEMP/oem:/oem:ro"
            --volume "$RUNNER_TEMP/storage:/storage"
          )

          if [[ "$CALLBACK" == "powershell" ]]; then
            docker_args+=(
              --publish "$TEST_PORT:$TEST_PORT/tcp"
              --env "USER_PORTS=$TEST_PORT"
            )
          fi

          docker run \
            "${docker_args[@]}" \
            "$IMAGE"

          if [[ "$CALLBACK" == "legacy" ]]; then
            docker pull python:3.12-alpine

            docker run --detach \
              --name "$RECEIVER" \
              --network "container:$CONTAINER" \
              --volume "$RUNNER_TEMP/receiver:/receiver:ro" \
              --volume "$RUNNER_TEMP/output:/output" \
              python:3.12-alpine \
              python /receiver/receiver.py
          fi

          echo
          echo "Container log:"
          echo "------------------------------------------------------------"

          docker logs \
            --follow \
            --timestamps \
            "$CONTAINER" &

          logs_pid="$!"

          stop_logs() {
            kill "$logs_pid" 2>/dev/null || true
            wait "$logs_pid" 2>/dev/null || true
          }

          trap stop_logs EXIT

          deadline=$((SECONDS + 9000))

          while (( SECONDS < deadline )); do
            state="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER" 2>/dev/null || true
            )"

            if [[ "$state" != "running" ]]; then
              echo
              echo "------------------------------------------------------------"
              echo "Container stopped before Windows became ready."
              echo "Container state: ${state:-missing}"
              exit 1
            fi

            response=""

            case "$CALLBACK" in
              powershell)
                response="$(
                  curl \
                    --silent \
                    --show-error \
                    --max-time 5 \
                    "http://127.0.0.1:$TEST_PORT/" \
                    2>/dev/null || true
                )"
                ;;

              legacy)
                if [[ -s "$RUNNER_TEMP/output/windows.json" ]]; then
                  response="$(
                    cat "$RUNNER_TEMP/output/windows.json"
                  )"
                fi
                ;;
            esac

            if [[ -n "$response" ]]; then
              stop_logs
              trap - EXIT

              echo
              echo "------------------------------------------------------------"
              echo "Received response:"

              jq . <<< "$response" || {
                echo "$response"
                echo "The guest returned invalid JSON."
                exit 1
              }

              token="$(jq -r '.token // empty' <<< "$response")"
              caption="$(jq -r '.caption // empty' <<< "$response")"
              edition="$(jq -r '.edition // empty' <<< "$response")"
              version="$(jq -r '.version // empty' <<< "$response")"
              build="$(jq -r '.build // empty' <<< "$response")"
              platform="$(jq -r '.platform // empty' <<< "$response")"

              if [[ "$token" != "$EXPECTED_TOKEN" ]]; then
                echo "The response token does not match."
                exit 1
              fi

              if [[ "$caption" != *"$EXPECTED_CAPTION"* ]]; then
                echo "Expected caption containing:"
                echo "  $EXPECTED_CAPTION"
                echo "Received:"
                echo "  $caption"
                exit 1
              fi

              if [[ -n "$EXPECTED_EDITION" &&
                    "$edition" != "$EXPECTED_EDITION" ]]; then
                echo "Expected edition: $EXPECTED_EDITION"
                echo "Received edition: $edition"
                exit 1
              fi

              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Unexpected Windows version: $version"
                exit 1
              fi

              if [[ ! "$build" =~ ^[0-9]+$ ]]; then
                echo "Invalid Windows build number: $build"
                exit 1
              fi

              if (( build < MINIMUM_BUILD )); then
                echo "Expected build $MINIMUM_BUILD or newer."
                echo "Received build: $build"
                exit 1
              fi

              if [[ "$platform" != "$EXPECTED_PLATFORM" ]]; then
                echo "Expected platform:"
                echo "  $EXPECTED_PLATFORM"
                echo "Received platform:"
                echo "  $platform"
                exit 1
              fi

              echo
              echo "$DISPLAY_NAME installed successfully."
              echo "Version: $version"
              echo "Build: $build"
              echo "Platform: $platform"
              exit 0
            fi

            sleep 10
          done

          echo
          echo "------------------------------------------------------------"
          echo "Timed out waiting for Windows installation."
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm --force "$RECEIVER" 2>/dev/null || true
          docker rm --force "$CONTAINER" 2>/dev/null || true
