name: Installation

on:
  workflow_call:
    inputs:
      name:
        description: Display name for the Windows version
        required: true
        type: string

      version:
        description: VERSION value passed to the container
        required: true
        type: string

      runner:
        description: GitHub Actions runner
        required: false
        default: ubuntu-24.04
        type: string

      image:
        description: Container image to test
        required: false
        default: ghcr.io/dockur/windows:latest
        type: string

      callback:
        description: Guest script type
        required: false
        default: powershell
        type: string

      cpu:
        description: CPU model exposed to Windows
        required: false
        default: host
        type: string

      expected_caption:
        description: Text expected in the Windows caption
        required: true
        type: string

      expected_edition:
        description: Expected Windows EditionID
        required: false
        default: ""
        type: string

      minimum_build:
        description: Minimum acceptable Windows build number
        required: true
        type: number

      platform:
        description: Expected Windows platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180

    env:
      CONTAINER: windows-test
      IMAGE: ${{ inputs.image }}

    steps:
      - name: Check KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          test -c /dev/kvm

      - name: Free disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/az \
            /opt/ghc \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx

          sudo apt-get clean
          sudo rm -rf \
            /var/cache/apt/* \
            /var/lib/apt/lists/*

          docker system prune \
            --all \
            --force \
            --volumes > /dev/null || true

          available_kb="$(df --output=avail / | tail -1)"
          available_gb="$((available_kb / 1024 / 1024))"

          echo "Available disk space: ${available_gb} GB"

          if (( available_gb < 40 )); then
            echo "At least 40 GB of free space is required."
            exit 1
          fi

      - name: Prepare installation test
        id: test
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
        run: |
          set -Eeuo pipefail

          case "$CALLBACK" in
            powershell | legacy)
              ;;
            *)
              echo "Unsupported guest script type: $CALLBACK"
              exit 1
              ;;
          esac

          token="$(cat /proc/sys/kernel/random/uuid)"

          mkdir -p \
            "$RUNNER_TEMP/data" \
            "$RUNNER_TEMP/oem" \
            "$RUNNER_TEMP/storage"

          printf '%s\n' "$token" > "$RUNNER_TEMP/data/readme.txt"

          case "$CALLBACK" in
            powershell)
              cat > "$RUNNER_TEMP/oem/ready.ps1" <<'POWERSHELL'
          param(
              [Parameter(Mandatory = $true)]
              [string]$Token
          )

          $ErrorActionPreference = "Stop"

          $windows = Get-CimInstance Win32_OperatingSystem
          $registry = Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $platform = switch (
              $env:PROCESSOR_ARCHITECTURE.ToUpperInvariant()
          ) {
              "AMD64" {
                  "x64"
              }
              "ARM64" {
                  "arm64"
              }
              "X86" {
                  "x86"
              }
              default {
                  $env:PROCESSOR_ARCHITECTURE.ToLowerInvariant()
              }
          }

          while ($true) {
              try {
                  $share = (
                      Get-Content `
                          -LiteralPath "\\host.lan\Data\readme.txt" `
                          -Raw
                  ).Trim()

                  $result = @{
                      token    = $Token
                      caption  = [string]$windows.Caption
                      edition  = [string]$registry.EditionID
                      version  = [string]$windows.Version
                      build    = [string]$windows.BuildNumber
                      platform = $platform
                      share    = $share
                  }

                  $json = $result | ConvertTo-Json -Compress
                  $temporary = "\\host.lan\Data\windows.tmp"
                  $destination = "\\host.lan\Data\windows.json"
                  $encoding = New-Object System.Text.UTF8Encoding($false)

                  [System.IO.File]::WriteAllText(
                      $temporary,
                      $json,
                      $encoding
                  )

                  Move-Item `
                      -LiteralPath $temporary `
                      -Destination $destination `
                      -Force

                  break
              }
              catch {
                  Start-Sleep -Seconds 10
              }
          }
          POWERSHELL

              cat > "$RUNNER_TEMP/oem/install.bat" <<EOF
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass ^
            -File C:\OEM\ready.ps1 ^
            -Token "$token"
          EOF
              ;;

            legacy)
              cat > "$RUNNER_TEMP/oem/install.bat" <<EOF
          @echo off

          ping 127.0.0.1 -n 16 >nul

          :retry
          echo $token > C:\windows.tmp

          copy /Y C:\windows.tmp "\\host.lan\Data\windows.txt" >nul 2>&1

          if errorlevel 1 (
            ping 127.0.0.1 -n 11 >nul
            goto retry
          )

          del /Q C:\windows.tmp >nul 2>&1
          EOF
              ;;
          esac

          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Pull image
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "$IMAGE"

          docker image inspect "$IMAGE" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Install and validate Windows
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
          CPU: ${{ inputs.cpu }}
          EXPECTED_TOKEN: ${{ steps.test.outputs.token }}
          EXPECTED_CAPTION: ${{ inputs.expected_caption }}
          EXPECTED_EDITION: ${{ inputs.expected_edition }}
          EXPECTED_PLATFORM: ${{ inputs.platform }}
          MINIMUM_BUILD: ${{ inputs.minimum_build }}
          VERSION: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.name }}
        run: |
          set -Eeuo pipefail

          samba_debug="N"
          [[ "$CALLBACK" == "legacy" ]] && samba_debug="Y"

          docker run --detach \
            --name "$CONTAINER" \
            --device /dev/kvm \
            --device /dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            --env "VERSION=$VERSION" \
            --env "RAM_SIZE=half" \
            --env "CPU_CORES=half" \
            --env "CPU_MODEL=$CPU" \
            --env "DISK_SIZE=64G" \
            --env "SAMBA_DEBUG=$samba_debug" \
            --volume "$RUNNER_TEMP/data:/shared" \
            --volume "$RUNNER_TEMP/oem:/oem:ro" \
            --volume "$RUNNER_TEMP/storage:/storage" \
            "$IMAGE"

          if [[ "$CALLBACK" == "legacy" ]]; then
            for ((i = 0; i < 60; i++)); do
              if docker exec "$CONTAINER" \
                smbcontrol all debug 3; then
                break
              fi

              sleep 1
            done
          fi

          echo
          echo "Container log:"
          echo "------------------------------------------------------------"

          docker logs \
            --follow \
            --timestamps \
            "$CONTAINER" &

          logs_pid="$!"

          stop_logs() {
            kill "$logs_pid" 2>/dev/null || true
            wait "$logs_pid" 2>/dev/null || true
          }

          trap stop_logs EXIT

          deadline=$((SECONDS + 9000))

          while (( SECONDS < deadline )); do
            state="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER" 2>/dev/null || true
            )"

            if [[ "$state" != "running" ]]; then
              echo
              echo "------------------------------------------------------------"
              echo "Container stopped before Windows became ready."
              echo "Container state: ${state:-missing}"
              exit 1
            fi

            if [[ "$CALLBACK" == "legacy" ]]; then
              response=""

              if [[ -s "$RUNNER_TEMP/data/windows.txt" ]]; then
                response="$(
                  tr -d '\r\n' \
                    < "$RUNNER_TEMP/data/windows.txt"
                )"
              fi

              if [[ -n "$response" ]]; then
                stop_logs
                trap - EXIT

                echo
                echo "------------------------------------------------------------"
                echo "Received legacy callback:"
                echo "  $response"

                if [[ "$response" != "$EXPECTED_TOKEN" ]]; then
                  echo "The legacy response token does not match."
                  echo "Expected:"
                  echo "  $EXPECTED_TOKEN"
                  echo "Received:"
                  echo "  $response"
                  exit 1
                fi

                echo
                echo "$DISPLAY_NAME installed successfully."
                echo "Legacy callback: writable"
                exit 0
              fi

              sleep 10
              continue
            fi

            response=""

            if [[ -s "$RUNNER_TEMP/data/windows.json" ]]; then
              response="$(cat "$RUNNER_TEMP/data/windows.json")"
            fi

            if [[ -n "$response" ]]; then
              stop_logs
              trap - EXIT

              echo
              echo "------------------------------------------------------------"
              echo "Received response:"

              if ! jq . <<< "$response"; then
                echo "$response"
                echo "The guest returned invalid JSON."
                exit 1
              fi

              token="$(jq -r '.token // empty' <<< "$response")"
              caption="$(jq -r '.caption // empty' <<< "$response")"
              edition="$(jq -r '.edition // empty' <<< "$response")"
              version="$(jq -r '.version // empty' <<< "$response")"
              build="$(jq -r '.build // empty' <<< "$response")"
              platform="$(jq -r '.platform // empty' <<< "$response")"
              share="$(jq -r '.share // empty' <<< "$response")"

              if [[ "$token" != "$EXPECTED_TOKEN" ]]; then
                echo "The response token does not match."
                exit 1
              fi

              if [[ "$share" != "$EXPECTED_TOKEN" ]]; then
                echo "Failed to read \\\\host.lan\\Data\\readme.txt."
                echo "Expected contents:"
                echo "  $EXPECTED_TOKEN"
                echo "Received:"
                echo "  ${share:-empty}"
                exit 1
              fi

              if [[ "$caption" != *"$EXPECTED_CAPTION"* ]]; then
                echo "Expected caption containing:"
                echo "  $EXPECTED_CAPTION"
                echo "Received:"
                echo "  $caption"
                exit 1
              fi

              if [[ -n "$EXPECTED_EDITION" &&
                    "$edition" != "$EXPECTED_EDITION" ]]; then
                echo "Expected edition: $EXPECTED_EDITION"
                echo "Received edition: $edition"
                exit 1
              fi

              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Unexpected Windows version: $version"
                exit 1
              fi

              if [[ ! "$build" =~ ^[0-9]+$ ]]; then
                echo "Invalid Windows build number: $build"
                exit 1
              fi

              if (( build < MINIMUM_BUILD )); then
                echo "Expected build $MINIMUM_BUILD or newer."
                echo "Received build: $build"
                exit 1
              fi

              if [[ "$platform" != "$EXPECTED_PLATFORM" ]]; then
                echo "Expected platform:"
                echo "  $EXPECTED_PLATFORM"
                echo "Received platform:"
                echo "  $platform"
                exit 1
              fi

              echo
              echo "$DISPLAY_NAME installed successfully."
              echo "Version: $version"
              echo "Build: $build"
              echo "Platform: $platform"
              echo "Shared file: accessible"
              exit 0
            fi

            sleep 10
          done

          echo
          echo "------------------------------------------------------------"
          echo "Timed out waiting for Windows installation."
          exit 1

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm --force "$CONTAINER" 2>/dev/null || true
