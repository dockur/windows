name: Installation

on:
  workflow_call:
    inputs:
      name:
        description: Display name for the Windows version
        required: true
        type: string

      version:
        description: VERSION value passed to the container
        required: true
        type: string

      callback:
        description: Guest callback method
        required: false
        default: powershell
        type: string

      expected_caption:
        description: Text expected in the Windows caption
        required: true
        type: string

      expected_edition:
        description: Expected Windows EditionID
        required: false
        default: ""
        type: string

      minimum_build:
        description: Minimum acceptable Windows build number
        required: true
        type: number

      architecture:
        description: Expected Windows architecture
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      CONTAINER: windows-test
      RECEIVER: windows-receiver
      IMAGE: ghcr.io/dockur/windows:latest
      TEST_PORT: "18080"

    steps:
      - name: Check KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Eqm1 'vmx|svm' /proc/cpuinfo
          test -c /dev/kvm

      - name: Free disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/az \
            /opt/ghc \
            /opt/google \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/pipx

          sudo apt-get clean
          sudo rm -rf \
            /var/cache/apt/* \
            /var/lib/apt/lists/*

          docker system prune \
            --all \
            --force \
            --volumes > /dev/null || true

          available_kb="$(df --output=avail / | tail -1)"
          available_gb="$((available_kb / 1024 / 1024))"

          echo "Available disk space: ${available_gb} GB"

          if (( available_gb < 40 )); then
            echo "At least 40 GB of free space is required."
            exit 1
          fi

      - name: Prepare installation test
        id: test
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
        run: |
          set -Eeuo pipefail

          case "$CALLBACK" in
            powershell | legacy)
              ;;
            *)
              echo "Unsupported callback method: $CALLBACK"
              exit 1
              ;;
          esac

          token="$(cat /proc/sys/kernel/random/uuid)"

          mkdir -p \
            "$RUNNER_TEMP/oem" \
            "$RUNNER_TEMP/output" \
            "$RUNNER_TEMP/receiver" \
            "$RUNNER_TEMP/storage"

          case "$CALLBACK" in
            powershell)
              cat > "$RUNNER_TEMP/oem/ready.ps1" <<'POWERSHELL'
          param(
              [Parameter(Mandatory = $true)]
              [string]$Token,

              [int]$Port = 18080
          )

          $ErrorActionPreference = "Stop"

          $windows = Get-CimInstance Win32_OperatingSystem
          $registry = Get-ItemProperty `
              "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $result = @{
              token        = $Token
              caption      = [string]$windows.Caption
              edition      = [string]$registry.EditionID
              version      = [string]$windows.Version
              build        = [string]$windows.BuildNumber
              architecture = [string]$windows.OSArchitecture
          }

          $bodyText = $result | ConvertTo-Json -Compress
          $body = [System.Text.Encoding]::UTF8.GetBytes($bodyText)

          netsh advfirewall firewall add rule `
              name="Dockur installation test" `
              dir=in `
              action=allow `
              protocol=TCP `
              localport=$Port | Out-Null

          $listener = New-Object System.Net.Sockets.TcpListener(
              [System.Net.IPAddress]::Any,
              $Port
          )

          $listener.Start()

          while ($true) {
              $client = $listener.AcceptTcpClient()

              try {
                  $stream = $client.GetStream()
                  $reader = New-Object System.IO.StreamReader($stream)

                  while ($true) {
                      $line = $reader.ReadLine()

                      if ([string]::IsNullOrEmpty($line)) {
                          break
                      }
                  }

                  $headerText = (
                      "HTTP/1.1 200 OK`r`n" +
                      "Content-Type: application/json`r`n" +
                      "Content-Length: $($body.Length)`r`n" +
                      "Connection: close`r`n" +
                      "`r`n"
                  )

                  $header = [System.Text.Encoding]::ASCII.GetBytes(
                      $headerText
                  )

                  $stream.Write($header, 0, $header.Length)
                  $stream.Write($body, 0, $body.Length)
                  $stream.Flush()
              }
              catch {
                  Write-Output $_
              }
              finally {
                  $client.Close()
              }
          }
          POWERSHELL

              cat > "$RUNNER_TEMP/oem/install.bat" <<EOF
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass ^
            -File C:\OEM\ready.ps1 ^
            -Token "$token" ^
            -Port $TEST_PORT
          EOF
              ;;

            legacy)
              cat > "$RUNNER_TEMP/oem/ready.vbs" <<EOF
          Option Explicit

          Dim service
          Dim systems
          Dim system
          Dim shell
          Dim request
          Dim caption
          Dim version
          Dim build
          Dim architecture
          Dim body

          Set service = GetObject("winmgmts:\\.\root\cimv2")
          Set systems = service.ExecQuery( _
              "Select * From Win32_OperatingSystem" _
          )

          caption = ""
          version = ""
          build = ""

          For Each system In systems
              caption = CStr(system.Caption)
              version = CStr(system.Version)
              build = CStr(system.BuildNumber)
              Exit For
          Next

          Set shell = CreateObject("WScript.Shell")

          architecture = UCase( _
              shell.ExpandEnvironmentStrings( _
                  "%PROCESSOR_ARCHITECTURE%" _
              ) _
          )

          If architecture = "AMD64" Or architecture = "IA64" Then
              architecture = "64-bit"
          Else
              architecture = "32-bit"
          End If

          body = _
              "token=" & Encode("$token") & _
              "&caption=" & Encode(caption) & _
              "&edition=" & _
              "&version=" & Encode(version) & _
              "&build=" & Encode(build) & _
              "&architecture=" & Encode(architecture)

          Set request = CreateObject("WinHttp.WinHttpRequest.5.1")

          request.Open _
              "POST", _
              "http://host.lan:$TEST_PORT/", _
              False

          request.SetRequestHeader _
              "Content-Type", _
              "application/x-www-form-urlencoded"

          request.Send body

          Function Encode(value)
              Dim stream
              Dim bytes
              Dim index
              Dim code
              Dim result

              Set stream = CreateObject("ADODB.Stream")

              stream.Type = 2
              stream.Charset = "utf-8"
              stream.Open
              stream.WriteText CStr(value)
              stream.Position = 0
              stream.Type = 1
              stream.Position = 3

              bytes = stream.Read
              stream.Close

              result = ""

              For index = 1 To LenB(bytes)
                  code = AscB(MidB(bytes, index, 1))

                  If _
                      (code >= 48 And code <= 57) Or _
                      (code >= 65 And code <= 90) Or _
                      (code >= 97 And code <= 122) Or _
                      code = 45 Or _
                      code = 46 Or _
                      code = 95 Or _
                      code = 126 _
                  Then
                      result = result & Chr(code)
                  ElseIf code = 32 Then
                      result = result & "+"
                  Else
                      result = result & "%" & _
                          Right("0" & Hex(code), 2)
                  End If
              Next

              Encode = result
          End Function
          EOF

              cat > "$RUNNER_TEMP/oem/install.bat" <<'BATCH'
          @echo off
          cscript.exe //nologo C:\OEM\ready.vbs
          BATCH

              cat > "$RUNNER_TEMP/receiver/receiver.py" <<'PYTHON'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path
          from urllib.parse import parse_qs

          OUTPUT = Path("/output/windows.json")


          class Handler(BaseHTTPRequestHandler):
              def do_POST(self) -> None:
                  length = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(length).decode(
                      "utf-8",
                      errors="replace",
                  )

                  values = parse_qs(
                      body,
                      keep_blank_values=True,
                  )

                  result = {
                      key: values.get(key, [""])[0]
                      for key in (
                          "token",
                          "caption",
                          "edition",
                          "version",
                          "build",
                          "architecture",
                      )
                  }

                  temporary = OUTPUT.with_suffix(".tmp")
                  temporary.write_text(
                      json.dumps(result),
                      encoding="utf-8",
                  )
                  temporary.replace(OUTPUT)

                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def log_message(self, format: str, *args: object) -> None:
                  return


          HTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
          PYTHON
              ;;
          esac

          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Pull image
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull "$IMAGE"

          docker image inspect "$IMAGE" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Install and validate Windows
        shell: bash
        env:
          CALLBACK: ${{ inputs.callback }}
          EXPECTED_TOKEN: ${{ steps.test.outputs.token }}
          EXPECTED_CAPTION: ${{ inputs.expected_caption }}
          EXPECTED_EDITION: ${{ inputs.expected_edition }}
          EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
          MINIMUM_BUILD: ${{ inputs.minimum_build }}
          VERSION: ${{ inputs.version }}
          DISPLAY_NAME: ${{ inputs.name }}
        run: |
          set -Eeuo pipefail

          docker_args=(
            --detach
            --name "$CONTAINER"
            --device /dev/kvm
            --device /dev/net/tun
            --cap-add NET_ADMIN
            --stop-timeout 120
            --env "VERSION=$VERSION"
            --env "RAM_SIZE=half"
            --env "CPU_CORES=half"
            --env "DISK_SIZE=64G"
            --env "DEBUG=Y"
            --volume "$RUNNER_TEMP/oem:/oem:ro"
            --volume "$RUNNER_TEMP/storage:/storage"
          )

          if [[ "$CALLBACK" == "powershell" ]]; then
            docker_args+=(
              --publish "$TEST_PORT:$TEST_PORT/tcp"
              --env "USER_PORTS=$TEST_PORT"
            )
          fi

          docker run \
            "${docker_args[@]}" \
            "$IMAGE"

          if [[ "$CALLBACK" == "legacy" ]]; then
            docker pull python:3.12-alpine

            docker run --detach \
              --name "$RECEIVER" \
              --network "container:$CONTAINER" \
              --volume "$RUNNER_TEMP/receiver:/receiver:ro" \
              --volume "$RUNNER_TEMP/output:/output" \
              python:3.12-alpine \
              python /receiver/receiver.py
          fi

          echo
          echo "Container log:"
          echo "------------------------------------------------------------"

          docker logs \
            --follow \
            --timestamps \
            "$CONTAINER" &

          logs_pid="$!"

          capture_screenshots() {
            local directory
            local file
            local i
            local client

            directory="$RUNNER_TEMP/output/screenshots"
            mkdir -p "$directory"

            if ! docker exec "$CONTAINER" \
              test -S /run/shm/monitor.sock; then
              echo "QEMU monitor socket does not exist." |
                tee "$directory/error.log"
              return
            fi

            if docker exec "$CONTAINER" \
              command -v socat > /dev/null 2>&1; then
              client="socat"
            elif docker exec "$CONTAINER" \
              sh -c 'nc -h 2>&1 | grep -q -- "-U"'; then
              client="nc"
            else
              echo "Neither socat nor Unix-socket capable nc is available." |
                tee "$directory/error.log"

              docker exec "$CONTAINER" \
                sh -c '
                  command -v socat || true
                  command -v nc || true
                  ls -l /run/shm/monitor.sock || true
                ' >> "$directory/error.log" 2>&1

              return
            fi

            echo "Using $client for QEMU monitor access."

            for i in $(seq -w 1 25); do
              file="screen-$i.ppm"

              case "$client" in
                socat)
                  docker exec "$CONTAINER" \
                    sh -c \
                    "printf 'screendump /storage/$file\nquit\n' |
                      socat - UNIX-CONNECT:/run/shm/monitor.sock" \
                    >> "$directory/capture.log" 2>&1 || true
                  ;;

                nc)
                  docker exec "$CONTAINER" \
                    sh -c \
                    "printf 'screendump /storage/$file\nquit\n' |
                      nc -U /run/shm/monitor.sock" \
                    >> "$directory/capture.log" 2>&1 || true
                  ;;
              esac

              if [[ -s "$RUNNER_TEMP/storage/$file" ]]; then
                mv \
                  "$RUNNER_TEMP/storage/$file" \
                  "$directory/$file"
              fi

              sleep 0.2
            done
          }

          detect_reboot_loop() {
            local count
            local timestamp

            while true; do
              sleep 10

              count="$(
                docker logs \
                  --since 30s \
                  "$CONTAINER" 2>&1 |
                  grep -c '^SeaBIOS ' || true
              )"

              if (( count >= 8 )); then
                echo
                echo "------------------------------------------------------------"
                echo "Detected a probable VM reboot loop."
                echo "SeaBIOS appeared $count times in the last 30 seconds."

                capture_screenshots

                timestamp="$(date --utc '+%Y-%m-%dT%H:%M:%SZ')"

                {
                  echo "Detected a probable VM reboot loop."
                  echo "SeaBIOS occurrences: $count"
                  echo "Window: 30 seconds"
                  echo "Timestamp: $timestamp"
                } > "$RUNNER_TEMP/output/reboot-loop.txt"

                return 0
              fi
            done
          }

          detect_reboot_loop &
          detector_pid="$!"

          stop_background_tasks() {
            kill "$detector_pid" 2>/dev/null || true
            wait "$detector_pid" 2>/dev/null || true

            kill "$logs_pid" 2>/dev/null || true
            wait "$logs_pid" 2>/dev/null || true
          }

          trap stop_background_tasks EXIT

          deadline=$((SECONDS + 9000))

          while (( SECONDS < deadline )); do
            state="$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER" 2>/dev/null || true
            )"

            if [[ "$state" != "running" ]]; then
              echo
              echo "------------------------------------------------------------"
              echo "Container stopped before Windows became ready."
              echo "Container state: ${state:-missing}"
              exit 1
            fi

            if [[ -f "$RUNNER_TEMP/output/reboot-loop.txt" ]]; then
              echo
              echo "------------------------------------------------------------"
              cat "$RUNNER_TEMP/output/reboot-loop.txt"
              exit 1
            fi

            response=""

            case "$CALLBACK" in
              powershell)
                response="$(
                  curl \
                    --silent \
                    --show-error \
                    --max-time 5 \
                    "http://127.0.0.1:$TEST_PORT/" \
                    2>/dev/null || true
                )"
                ;;

              legacy)
                if [[ -s "$RUNNER_TEMP/output/windows.json" ]]; then
                  response="$(
                    cat "$RUNNER_TEMP/output/windows.json"
                  )"
                fi
                ;;
            esac

            if [[ -n "$response" ]]; then
              stop_background_tasks
              trap - EXIT

              echo
              echo "------------------------------------------------------------"
              echo "Received response:"

              jq . <<< "$response" || {
                echo "$response"
                echo "The guest returned invalid JSON."
                exit 1
              }

              token="$(jq -r '.token // empty' <<< "$response")"
              caption="$(jq -r '.caption // empty' <<< "$response")"
              edition="$(jq -r '.edition // empty' <<< "$response")"
              version="$(jq -r '.version // empty' <<< "$response")"
              build="$(jq -r '.build // empty' <<< "$response")"

              architecture="$(
                jq -r '.architecture // empty' <<< "$response"
              )"

              if [[ "$token" != "$EXPECTED_TOKEN" ]]; then
                echo "The response token does not match."
                exit 1
              fi

              if [[ "$caption" != *"$EXPECTED_CAPTION"* ]]; then
                echo "Expected caption containing:"
                echo "  $EXPECTED_CAPTION"
                echo "Received:"
                echo "  $caption"
                exit 1
              fi

              if [[ -n "$EXPECTED_EDITION" &&
                    "$edition" != "$EXPECTED_EDITION" ]]; then
                echo "Expected edition: $EXPECTED_EDITION"
                echo "Received edition: $edition"
                exit 1
              fi

              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Unexpected Windows version: $version"
                exit 1
              fi

              if [[ ! "$build" =~ ^[0-9]+$ ]]; then
                echo "Invalid Windows build number: $build"
                exit 1
              fi

              if (( build < MINIMUM_BUILD )); then
                echo "Expected build $MINIMUM_BUILD or newer."
                echo "Received build: $build"
                exit 1
              fi

              if [[ "$architecture" != "$EXPECTED_ARCHITECTURE" ]]; then
                echo "Expected architecture:"
                echo "  $EXPECTED_ARCHITECTURE"
                echo "Received architecture:"
                echo "  $architecture"
                exit 1
              fi

              printf '%s\n' "$response" |
                jq . > "$RUNNER_TEMP/output/windows.json"

              echo
              echo "$DISPLAY_NAME installed successfully."
              echo "Version: $version"
              echo "Build: $build"
              echo "Architecture: $architecture"
              exit 0
            fi

            sleep 10
          done

          echo
          echo "------------------------------------------------------------"
          echo "Timed out waiting for Windows installation."
          exit 1

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          docker logs "$CONTAINER" \
            > "$RUNNER_TEMP/output/container.log" \
            2>&1

          docker inspect "$CONTAINER" \
            > "$RUNNER_TEMP/output/container.json" \
            2>&1

          if docker inspect "$RECEIVER" > /dev/null 2>&1; then
            docker logs "$RECEIVER" \
              > "$RUNNER_TEMP/output/receiver.log" \
              2>&1

            docker inspect "$RECEIVER" \
              > "$RUNNER_TEMP/output/receiver.json" \
              2>&1
          fi

          df -h \
            > "$RUNNER_TEMP/output/filesystems.txt" \
            2>&1

          echo "Final disk space:"
          df -h /

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.version }}-validation
          path: ${{ runner.temp }}/output
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm --force "$RECEIVER" 2>/dev/null || true
          docker rm --force "$CONTAINER" 2>/dev/null || true
