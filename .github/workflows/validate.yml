name: XP Validation

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Default
            cpu_flags: ""

          - name: No topoext
            cpu_flags: topoext=off

          - name: No topoext or cr8legacy
            cpu_flags: topoext=off,cr8legacy=off

          - name: No topoext, cr8legacy, or SVM
            cpu_flags: topoext=off,cr8legacy=off,svm=off

          - name: No topoext, cr8legacy, SVM, or x2APIC
            cpu_flags: topoext=off,cr8legacy=off,svm=off,x2apic=off

    name: Windows XP x86 - ${{ matrix.name }}

    uses: ./.github/workflows/install.yml
    with:
      name: XP q35 + host + blk - ${{ matrix.name }}
      version: "xp"
      callback: legacy
      machine: q35
      cpu: host
      cpu_flags: ${{ matrix.cpu_flags }}
      disk_type: blk
      kill_on_failure: true
      expected_caption: Windows XP
      minimum_build: 2600
      platform: x86
