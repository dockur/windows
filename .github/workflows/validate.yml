name: XP Validation

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows XP x86 - host + blk
            cpu: host
            disk_type: blk

          - name: Windows XP x86 - host + ide
            cpu: host
            disk_type: ide

          - name: Windows XP x86 - qemu32 + blk
            cpu: qemu32
            disk_type: blk

          - name: Windows XP x86 - qemu32 + ide
            cpu: qemu32
            disk_type: ide

    name: ${{ matrix.name }}
    uses: ./.github/workflows/install.yml
    with:
      name: ${{ matrix.name }}
      version: "xp"
      callback: legacy
      cpu: ${{ matrix.cpu }}
      disk_type: ${{ matrix.disk_type }}
      expected_caption: Windows XP
      minimum_build: 2600
      platform: x86
