name: XP NX Subtractive Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-nx-subtractive-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kvm32 control
            cpu: kvm32
            cpu_flags: ""

          - name: kvm32 + NX
            cpu: kvm32
            cpu_flags: nx=on

          - name: Opteron G1 - NX
            cpu: Opteron_G1
            cpu_flags: nx=off

          - name: host - NX
            cpu: host
            cpu_flags: nx=off

    name: Windows XP x86 - ${{ matrix.name }}

    uses: ./.github/workflows/install.yml
    with:
      name: XP q35 + ${{ matrix.name }} + blk
      version: "xp"
      branch: dev
      callback: legacy
      machine: q35
      cpu: ${{ matrix.cpu }}
      cpu_flags: ${{ matrix.cpu_flags }}
      disk_type: blk
      kill_on_failure: false
      expected_caption: Windows XP
      minimum_build: 2600
      platform: x86
