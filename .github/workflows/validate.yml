name: XP CPU Feature Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-cpu-feature-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kvm32 control
            cpu: kvm32
            cpu_flags: ""

          - name: kvm32 + LM
            cpu: kvm32
            cpu_flags: lm=on

          - name: kvm32 + NX
            cpu: kvm32
            cpu_flags: nx=on

          - name: kvm32 + SYSCALL
            cpu: kvm32
            cpu_flags: syscall=on

          - name: kvm32 + LM + NX
            cpu: kvm32
            cpu_flags: lm=on,nx=on

          - name: kvm32 + LM + SYSCALL
            cpu: kvm32
            cpu_flags: lm=on,syscall=on

          - name: kvm32 + NX + SYSCALL
            cpu: kvm32
            cpu_flags: nx=on,syscall=on

          - name: kvm32 + LM + NX + SYSCALL
            cpu: kvm32
            cpu_flags: lm=on,nx=on,syscall=on

    name: Windows XP x86 - ${{ matrix.name }}

    uses: ./.github/workflows/install.yml
    with:
      name: XP q35 + ${{ matrix.name }} + blk
      version: "xp"
      callback: legacy
      machine: q35
      cpu: ${{ matrix.cpu }}
      cpu_flags: ${{ matrix.cpu_flags }}
      disk_type: blk
      kill_on_failure: true
      expected_caption: Windows XP
      minimum_build: 2600
      platform: x86
