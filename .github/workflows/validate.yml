name: Validation

on:
  release:
    types:
      - published

  workflow_dispatch:

  push:
    branches:
      - test
    paths:
      - ".github/workflows/install.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 Pro
            version: "11"
            callback: powershell
            expected_caption: Windows 11
            expected_edition: Professional
            minimum_build: 22000
            platform: x64

          - name: Windows XP Professional
            cpu: qemu32 # Remove after 6.03
            version: "xp"
            callback: legacy
            expected_caption: Windows XP
            expected_edition: ""
            minimum_build: 2600
            platform: x86

          - name: Windows 2000 Professional
            version: "2000"
            callback: legacy
            expected_caption: Windows 2000
            expected_edition: ""
            minimum_build: 2195
            platform: x86

    name: ${{ matrix.name }}
    uses: ./.github/workflows/install.yml
    with:
      name: ${{ matrix.name }}
      version: ${{ matrix.version }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      image: ${{ matrix.image || 'ghcr.io/dockur/windows:latest' }}
      callback: ${{ matrix.callback }}
      cpu: ${{ matrix.cpu || 'host' }}
      expected_caption: ${{ matrix.expected_caption }}
      expected_edition: ${{ matrix.expected_edition }}
      minimum_build: ${{ matrix.minimum_build }}
      platform: ${{ matrix.platform }}
