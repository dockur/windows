name: XP Validation

on:
  release:
    types:
      - published

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xp:
    strategy:
      fail-fast: false
      matrix:
        machine:
          - q35
          - pc-q35-2.10
          - pc

        cpu:
          - host
          - qemu32

        disk_type:
          - blk
          - ide

    name: Windows XP x86 - ${{ matrix.machine }} + ${{ matrix.cpu }} + ${{ matrix.disk_type }}

    uses: ./.github/workflows/install.yml
    with:
      name: XP ${{ matrix.machine }} + ${{ matrix.cpu }} + ${{ matrix.disk_type }}
      version: "xp"
      callback: legacy
      machine: ${{ matrix.machine }}
      cpu: ${{ matrix.cpu }}
      disk_type: ${{ matrix.disk_type }}
      kill_on_failure: true
      expected_caption: Windows XP
      minimum_build: 2600
      platform: x86
